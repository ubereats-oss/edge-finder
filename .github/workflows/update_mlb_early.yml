name: Atualizar MLB (early)
on:
  workflow_dispatch:
permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mlb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install axios firebase-admin
      - name: Injetar chaves
        run: |
          node -e "
          const keys = process.env.ODDS_API_KEYS.split(',');
          keys.forEach(k => console.log('::add-mask::' + k.trim()));
          const lines = keys.map((k,i) => (i===0?'ODDS_API_KEY':'ODDS_API_KEY_'+(i+1))+'='+k.trim());
          require('fs').appendFileSync(process.env.GITHUB_ENV, lines.join('\n')+'\n');
          "
        env:
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
      - name: Restaurar stats MLB
        run: |
          git fetch origin data 2>/dev/null || true
          git show origin/data:mlb_player_stats.json.gz > /tmp/mlb_ps.gz 2>/dev/null && \
            gunzip -c /tmp/mlb_ps.gz > mlb_player_stats.json || true
          for f in mlb_player_team.json mlb_injuries_today.json; do
            git show origin/data:$f > $f 2>/dev/null || true
          done
          git show origin/data:bets.json > bets.json 2>/dev/null || echo '[]' > bets.json
      - run: node pipeline/get_mlb_injuries.js
      - run: node pipeline/get_mlb_player_teams.js
      - run: node pipeline/get_mlb_props.js
      - run: node pipeline/model_mlb_props.js
      - name: Sincronizar com Firestore
        run: node pipeline/firebase_sync.js results
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Sincronizar apostas com Firestore
        run: node pipeline/firebase_sync.js bets
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Salvar dados na branch data
        run: |
          cp .github/scripts/save_stats_gz.sh /tmp/save_stats_gz.sh
          mkdir -p /tmp/data-save
          gzip -n -c mlb_player_stats.json > /tmp/data-save/mlb_player_stats.json.gz 2>/dev/null || true
          for f in mlb_player_team.json mlb_injuries_today.json bets.json; do
            [ -f "$f" ] && cp "$f" /tmp/data-save/ || true
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin data 2>/dev/null || true
          git checkout -b data-work origin/data --force 2>/dev/null || \
            (git checkout --orphan data-work && git rm -rf . --quiet && printf 'node_modules/\n' > .gitignore && git add .gitignore)
          for f in /tmp/data-save/*.gz; do
            [ -f "$f" ] || continue
            bash /tmp/save_stats_gz.sh "$(basename "$f" _player_stats.json.gz)" "$f" "$(basename "$f")"
          done
          rm -f /tmp/data-save/*.gz
          cp /tmp/data-save/* . 2>/dev/null || true
          for f in mlb_player_stats.json.gz mlb_player_team.json mlb_injuries_today.json bets.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          git diff --staged --quiet && echo "Sem mudanças" || git commit -m "data-mlb-early: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push origin data-work:data