name: Atualizar Todos os Esportes

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      sports:
        description: 'Esporte(s) a atualizar'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - nba
          - mlb
          - nhl
          - nfl
          - tennis

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── NBA (out-abr) ──────────────────────────────────────────────────────────
  nba:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar mês (temporada NBA out-jun)
        id: season
        run: |
          MONTH=$(date -u +%-m)
          echo "month=$MONTH" >> $GITHUB_OUTPUT
          if [[ "$MONTH" -ge 10 || "$MONTH" -le 4 ]]; then
            echo "in_season=true" >> $GITHUB_OUTPUT
          else
            echo "in_season=false" >> $GITHUB_OUTPUT
          fi

      - name: Pular se fora de temporada
        if: steps.season.outputs.in_season == 'false' && github.event_name == 'schedule'
        run: echo "NBA fora de temporada (mai-set) — pulando." && exit 0

      - uses: actions/checkout@v4
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nba'
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nba'
        with:
          node-version: '24'

      - uses: actions/cache@v4
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nba'
        with:
          path: ~/.npm
          key: npm-axios-${{ runner.os }}

      - run: npm install axios
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nba'

      - name: Injetar chaves
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nba'
        run: |
          node -e "
          const keys = process.env.ODDS_API_KEYS.split(',');
          keys.forEach(k => console.log('::add-mask::' + k.trim()));
          const lines = keys.map((k,i) => (i===0?'ODDS_API_KEY':'ODDS_API_KEY_'+(i+1))+'='+k.trim());
          require('fs').appendFileSync(process.env.GITHUB_ENV, lines.join('\n')+'\n');
          console.log('Chaves injetadas:',keys.length);
          "
        env:
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}

      - name: Restaurar stats NBA
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nba'
        run: |
          git fetch origin data 2>/dev/null || true
          git show origin/data:nba_player_stats.json.gz > /tmp/nba_ps.gz 2>/dev/null && \
            gunzip -c /tmp/nba_ps.gz > nba_player_stats.json || true
          for f in nba_player_team.json nba_boxscores_cache.json nba_injuries_today.json nba_rating.json; do
            git show origin/data:$f > $f 2>/dev/null || rm -f $f
          done
          git show origin/data:bets.json > bets.json 2>/dev/null || echo '[]' > bets.json
          mkdir -p odds_history
          git checkout origin/data -- 'odds_history/basketball_nba_model_br_*.json' 'odds_history/model_ledger_nba_*.json' 2>/dev/null || true

      - run: node pipeline/get_nba_injuries.js
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nba'
      - run: node pipeline/get_nba_player_teams.js
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nba'
      - run: node pipeline/get_nba_props_br.js
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nba'
      - run: node pipeline/model_nba_props_br.js
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nba'
      - run: node pipeline/get_nba_odds.js
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nba'
      - run: node pipeline/model_nba.js
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nba'

      - name: Empacotar artefatos NBA
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nba'
        run: |
          mkdir -p /tmp/nba-out
          gzip -n -c nba_player_stats.json > /tmp/nba-out/nba_player_stats.json.gz 2>/dev/null || true
          for f in nba_props_br_results.json nba_results.json nba_player_team.json nba_player_positions.json nba_boxscores_cache.json nba_injuries_today.json nba_rating.json bets.json; do
            [ -f "$f" ] && cp "$f" /tmp/nba-out/ || true
          done
          mkdir -p /tmp/nba-out/odds_history
          for f in odds_history/basketball_nba_model_br_*.json odds_history/model_ledger_nba_*.json; do
            [ -f "$f" ] && cp "$f" /tmp/nba-out/odds_history/ || true
          done

      - uses: actions/upload-artifact@v4
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nba'
        with:
          name: nba-out
          path: /tmp/nba-out/
          if-no-files-found: warn
          retention-days: 1

  # ── MLB (mar-out) ──────────────────────────────────────────────────────────
  mlb:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar mês (temporada MLB mar-out)
        id: season
        run: |
          MONTH=$(date -u +%-m)
          echo "month=$MONTH" >> $GITHUB_OUTPUT
          if [[ "$MONTH" -ge 3 && "$MONTH" -le 10 ]]; then
            echo "in_season=true" >> $GITHUB_OUTPUT
          else
            echo "in_season=false" >> $GITHUB_OUTPUT
          fi

      - name: Pular se fora de temporada
        if: steps.season.outputs.in_season == 'false' && github.event_name == 'schedule'
        run: echo "MLB fora de temporada (nov-fev) — pulando." && exit 0

      - uses: actions/checkout@v4
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'mlb'
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'mlb'
        with:
          node-version: '24'

      - uses: actions/cache@v4
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'mlb'
        with:
          path: ~/.npm
          key: npm-axios-${{ runner.os }}

      - run: npm install axios
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'mlb'

      - name: Injetar chaves
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'mlb'
        run: |
          node -e "
          const keys = process.env.ODDS_API_KEYS.split(',');
          keys.forEach(k => console.log('::add-mask::' + k.trim()));
          const lines = keys.map((k,i) => (i===0?'ODDS_API_KEY':'ODDS_API_KEY_'+(i+1))+'='+k.trim());
          require('fs').appendFileSync(process.env.GITHUB_ENV, lines.join('\n')+'\n');
          "
        env:
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}

      - name: Restaurar stats MLB
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'mlb'
        run: |
          git fetch origin data 2>/dev/null || true
          git show origin/data:mlb_player_stats.json.gz > /tmp/mlb_ps.gz 2>/dev/null && \
            gunzip -c /tmp/mlb_ps.gz > mlb_player_stats.json || true
          for f in mlb_player_team.json mlb_injuries_today.json mlb_team_rating.json; do
            git show origin/data:$f > $f 2>/dev/null || rm -f $f
          done
          mkdir -p odds_history
          git checkout origin/data -- 'odds_history/baseball_mlb_model_*.json' 'odds_history/model_ledger_mlb_*.json' 2>/dev/null || true

      - run: node pipeline/get_mlb_injuries.js
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'mlb'
      - run: node pipeline/get_mlb_player_teams.js
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'mlb'
      - run: node pipeline/get_mlb_props.js
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'mlb'
      - run: node pipeline/model_mlb_props.js
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'mlb'
      - run: node pipeline/get_mlb_odds.js
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'mlb'
      - run: node pipeline/model_mlb.js
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'mlb'

      - name: Empacotar artefatos MLB
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'mlb'
        run: |
          mkdir -p /tmp/mlb-out
          gzip -n -c mlb_player_stats.json > /tmp/mlb-out/mlb_player_stats.json.gz 2>/dev/null || true
          for f in mlb_results.json mlb_props_results.json mlb_player_team.json mlb_injuries_today.json mlb_team_rating.json; do
            [ -f "$f" ] && cp "$f" /tmp/mlb-out/ || true
          done
          mkdir -p /tmp/mlb-out/odds_history
          for f in odds_history/baseball_mlb_model_*.json odds_history/model_ledger_mlb_*.json; do
            [ -f "$f" ] && cp "$f" /tmp/mlb-out/odds_history/ || true
          done

      - uses: actions/upload-artifact@v4
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'mlb'
        with:
          name: mlb-out
          path: /tmp/mlb-out/
          if-no-files-found: warn
          retention-days: 1

  # ── NHL (out-mai) ──────────────────────────────────────────────────────────
  nhl:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar mês (temporada NHL out-mai)
        id: season
        run: |
          MONTH=$(date -u +%-m)
          echo "month=$MONTH" >> $GITHUB_OUTPUT
          if [[ "$MONTH" -ge 10 || "$MONTH" -le 5 ]]; then
            echo "in_season=true" >> $GITHUB_OUTPUT
          else
            echo "in_season=false" >> $GITHUB_OUTPUT
          fi

      - name: Pular se fora de temporada
        if: steps.season.outputs.in_season == 'false' && github.event_name == 'schedule'
        run: echo "NHL fora de temporada (jun-set) — pulando." && exit 0

      - uses: actions/checkout@v4
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nhl'
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nhl'
        with:
          node-version: '24'

      - uses: actions/cache@v4
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nhl'
        with:
          path: ~/.npm
          key: npm-axios-${{ runner.os }}

      - run: npm install axios
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nhl'

      - name: Injetar chaves
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nhl'
        run: |
          node -e "
          const keys = process.env.ODDS_API_KEYS.split(',');
          keys.forEach(k => console.log('::add-mask::' + k.trim()));
          const lines = keys.map((k,i) => (i===0?'ODDS_API_KEY':'ODDS_API_KEY_'+(i+1))+'='+k.trim());
          require('fs').appendFileSync(process.env.GITHUB_ENV, lines.join('\n')+'\n');
          "
        env:
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}

      - name: Restaurar stats NHL
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nhl'
        run: |
          git fetch origin data 2>/dev/null || true
          git show origin/data:nhl_player_stats.json.gz > /tmp/nhl_ps.gz 2>/dev/null || true
          GZ_SIZE=$(wc -c < /tmp/nhl_ps.gz 2>/dev/null || echo 0)
          if [ "$GZ_SIZE" -gt 1000 ]; then
            gunzip -c /tmp/nhl_ps.gz > nhl_player_stats.json 2>/dev/null || true
            echo "nhl_player_stats.json restaurado: $(wc -c < nhl_player_stats.json) bytes"
          else
            echo "nhl_player_stats.json.gz ausente ou inválido ($GZ_SIZE bytes) — histórico incremental do zero"
            rm -f nhl_player_stats.json
          fi
          git show origin/data:nhl_player_team.json > nhl_player_team.json 2>/dev/null || true
          mkdir -p odds_history
          git checkout origin/data -- 'odds_history/hockey_nhl_model_*.json' 'odds_history/model_ledger_nhl_*.json' 2>/dev/null || true

      - run: node pipeline/get_nhl_player_teams.js
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nhl'
      - run: node pipeline/get_nhl_player_stats.js
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nhl'
      - run: node pipeline/get_nhl_props.js
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nhl'
      - run: node pipeline/model_nhl_props.js
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nhl'

      - name: Empacotar artefatos NHL
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nhl'
        run: |
          mkdir -p /tmp/nhl-out
          gzip -n -c nhl_player_stats.json > /tmp/nhl-out/nhl_player_stats.json.gz 2>/dev/null || true
          for f in nhl_props_results.json nhl_player_team.json; do
            [ -f "$f" ] && cp "$f" /tmp/nhl-out/ || true
          done
          mkdir -p /tmp/nhl-out/odds_history
          for f in odds_history/hockey_nhl_model_*.json odds_history/model_ledger_nhl_*.json; do
            [ -f "$f" ] && cp "$f" /tmp/nhl-out/odds_history/ || true
          done

      - uses: actions/upload-artifact@v4
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nhl'
        with:
          name: nhl-out
          path: /tmp/nhl-out/
          if-no-files-found: warn
          retention-days: 1

  # ── NFL (set-fev) ──────────────────────────────────────────────────────────
  nfl:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar mês (temporada NFL set-fev)
        id: season
        run: |
          MONTH=$(date -u +%-m)
          echo "month=$MONTH" >> $GITHUB_OUTPUT
          if [[ "$MONTH" -ge 9 || "$MONTH" -le 2 ]]; then
            echo "in_season=true" >> $GITHUB_OUTPUT
          else
            echo "in_season=false" >> $GITHUB_OUTPUT
          fi

      - name: Pular se fora de temporada
        if: steps.season.outputs.in_season == 'false' && github.event_name == 'schedule'
        run: echo "NFL fora de temporada (mar-ago) — pulando." && exit 0

      - uses: actions/checkout@v4
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nfl'
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nfl'
        with:
          node-version: '24'

      - uses: actions/cache@v4
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nfl'
        with:
          path: ~/.npm
          key: npm-axios-${{ runner.os }}

      - run: npm install axios
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nfl'

      - name: Injetar chaves
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nfl'
        run: |
          node -e "
          const keys = process.env.ODDS_API_KEYS.split(',');
          keys.forEach(k => console.log('::add-mask::' + k.trim()));
          const lines = keys.map((k,i) => (i===0?'ODDS_API_KEY':'ODDS_API_KEY_'+(i+1))+'='+k.trim());
          require('fs').appendFileSync(process.env.GITHUB_ENV, lines.join('\n')+'\n');
          "
        env:
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}

      - name: Restaurar stats NFL
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nfl'
        run: |
          git fetch origin data 2>/dev/null || true
          git show origin/data:nfl_player_stats.json.gz > /tmp/nfl_ps.gz 2>/dev/null || true
          GZ_SIZE=$(wc -c < /tmp/nfl_ps.gz 2>/dev/null || echo 0)
          if [ "$GZ_SIZE" -gt 1000 ]; then
            gunzip -c /tmp/nfl_ps.gz > nfl_player_stats.json 2>/dev/null || true
            echo "nfl_player_stats.json restaurado: $(wc -c < nfl_player_stats.json) bytes"
          else
            echo "nfl_player_stats.json.gz ausente ou invalido ($GZ_SIZE bytes) — iniciando do zero"
            rm -f nfl_player_stats.json
          fi
          git show origin/data:nfl_player_team.json > nfl_player_team.json 2>/dev/null || true
          mkdir -p odds_history
          git checkout origin/data -- 'odds_history/football_nfl_model_*.json' 'odds_history/model_ledger_nfl_*.json' 2>/dev/null || true

      - run: node pipeline/get_nfl_player_teams.js
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nfl'
      - run: node pipeline/get_nfl_player_stats.js
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nfl'
      - run: node pipeline/get_nfl_props.js
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nfl'
      - run: node pipeline/model_nfl_props.js
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nfl'

      - name: Empacotar artefatos NFL
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nfl'
        run: |
          mkdir -p /tmp/nfl-out
          gzip -n -c nfl_player_stats.json > /tmp/nfl-out/nfl_player_stats.json.gz 2>/dev/null || true
          for f in nfl_props_results.json nfl_player_team.json; do
            [ -f "$f" ] && cp "$f" /tmp/nfl-out/ || true
          done
          mkdir -p /tmp/nfl-out/odds_history
          for f in odds_history/football_nfl_model_*.json odds_history/model_ledger_nfl_*.json; do
            [ -f "$f" ] && cp "$f" /tmp/nfl-out/odds_history/ || true
          done

      - uses: actions/upload-artifact@v4
        if: steps.season.outputs.in_season == 'true' || github.event.inputs.sports == 'nfl'
        with:
          name: nfl-out
          path: /tmp/nfl-out/
          if-no-files-found: warn
          retention-days: 1

  # ── TÊNIS (ano inteiro) ────────────────────────────────────────────────────
  tennis:
    if: >-
      github.event_name == 'schedule' ||
      github.event.inputs.sports == 'all' ||
      github.event.inputs.sports == 'tennis'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-axios-${{ runner.os }}

      - run: npm install axios

      - name: Injetar chaves
        run: |
          node -e "
          const keys = process.env.ODDS_API_KEYS.split(',');
          keys.forEach(k => console.log('::add-mask::' + k.trim()));
          const lines = keys.map((k,i) => (i===0?'ODDS_API_KEY':'ODDS_API_KEY_'+(i+1))+'='+k.trim());
          require('fs').appendFileSync(process.env.GITHUB_ENV, lines.join('\n')+'\n');
          "
        env:
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}

      - name: Restaurar stats Tênis
        run: |
          git fetch origin data 2>/dev/null || true
          git show origin/data:ranking.json > ranking.json 2>/dev/null || true

      - run: node pipeline/get_odds.js
      - run: node pipeline/model_prob.js

      - name: Empacotar artefatos Tênis
        run: |
          mkdir -p /tmp/tennis-out
          for f in model_results.json; do
            [ -f "$f" ] && cp "$f" /tmp/tennis-out/ || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: tennis-out
          path: /tmp/tennis-out/
          if-no-files-found: warn
          retention-days: 1

  # ── SALVAR DADOS (após todos os jobs) ─────────────────────────────────────
  save-data:
    needs: [nba, mlb, nhl, nfl, tennis]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-firebase-${{ runner.os }}

      - run: npm install firebase-admin

      - name: Baixar artefatos NBA
        uses: actions/download-artifact@v4
        with:
          name: nba-out
          path: /tmp/nba-out/
          if-no-artifact-found: ignore
        continue-on-error: true

      - name: Baixar artefatos MLB
        uses: actions/download-artifact@v4
        with:
          name: mlb-out
          path: /tmp/mlb-out/
          if-no-artifact-found: ignore
        continue-on-error: true

      - name: Baixar artefatos NHL
        uses: actions/download-artifact@v4
        with:
          name: nhl-out
          path: /tmp/nhl-out/
          if-no-artifact-found: ignore
        continue-on-error: true

      - name: Baixar artefatos NFL
        uses: actions/download-artifact@v4
        with:
          name: nfl-out
          path: /tmp/nfl-out/
          if-no-artifact-found: ignore
        continue-on-error: true

      - name: Baixar artefatos Tênis
        uses: actions/download-artifact@v4
        with:
          name: tennis-out
          path: /tmp/tennis-out/
          if-no-artifact-found: ignore
        continue-on-error: true

      - name: Copiar artefatos para diretório de trabalho
        run: |
          mkdir -p odds_history
          for dir in /tmp/nba-out /tmp/mlb-out /tmp/nhl-out /tmp/nfl-out /tmp/tennis-out; do
            if [ -d "$dir" ]; then
              cp "$dir"/* . 2>/dev/null || true
              [ -d "$dir/odds_history" ] && cp "$dir"/odds_history/*.json odds_history/ 2>/dev/null || true
            fi
          done
          git fetch origin data 2>/dev/null || true
          git show origin/data:bets.json > bets.json 2>/dev/null || echo '[]' > bets.json

      - name: Sincronizar resultados com Firestore
        run: node pipeline/firebase_sync.js results
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Sincronizar apostas com Firestore
        run: node pipeline/firebase_sync.js bets
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Salvar dados na branch data
        # Se o push for rejeitado porque a branch data avançou (ex.: uma
        # execução de capture_closing_odds.js gravou no meio tempo),
        # recarrega o estado mais recente e reaplica só o histórico de
        # indicações desta execução por cima dele, preservando
        # closingOdds/clv que já existam — repete com espera crescente
        # antes de desistir. Ver pipeline/reapply_ledger_changes.js.
        run: |
          cp .github/scripts/save_stats_gz.sh /tmp/save_stats_gz.sh
          mkdir -p /tmp/to-save /tmp/to-save/odds_history /tmp/to-save-gz /tmp/ledger_scripts
          for dir in /tmp/nba-out /tmp/mlb-out /tmp/nhl-out /tmp/nfl-out /tmp/tennis-out; do
            if [ -d "$dir" ]; then
              cp "$dir"/* /tmp/to-save/ 2>/dev/null || true
              [ -d "$dir/odds_history" ] && cp "$dir"/odds_history/*.json /tmp/to-save/odds_history/ 2>/dev/null || true
            fi
          done
          mv /tmp/to-save/*.gz /tmp/to-save-gz/ 2>/dev/null || true
          cp pipeline/reapply_ledger_changes.js pipeline/model_ledger.js /tmp/ledger_scripts/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          attempt=1
          max_attempts=6
          delay=10
          while true; do
            git fetch origin data 2>/dev/null || true
            git checkout -B data-work origin/data --force 2>/dev/null || \
              (git checkout --orphan data-work && git rm -rf . --quiet && printf 'node_modules/\n' > .gitignore && git add .gitignore)
            mkdir -p odds_history

            for f in /tmp/to-save-gz/*.gz; do
              [ -f "$f" ] || continue
              bash /tmp/save_stats_gz.sh "$(basename "$f" _player_stats.json.gz)" "$f" "$(basename "$f")"
            done
            cp /tmp/to-save/* . 2>/dev/null || true
            if [ "$attempt" -gt 1 ]; then
              node /tmp/ledger_scripts/reapply_ledger_changes.js protect-closing-odds /tmp/to-save/odds_history --retry
            else
              node /tmp/ledger_scripts/reapply_ledger_changes.js protect-closing-odds /tmp/to-save/odds_history
            fi

            odds_history_patterns=(model_ledger_*.json basketball_nba_model_br_*.json baseball_mlb_model_*.json hockey_nhl_model_*.json football_nfl_model_*.json)
            included_patterns=()
            for pattern in "${odds_history_patterns[@]}"; do
              matched=false
              for f in odds_history/$pattern; do
                [ -f "$f" ] || continue
                git add "$f"
                matched=true
              done
              [ "$matched" = true ] && included_patterns+=("$pattern")
            done
            for f in *.gz nba_player_team.json nba_player_positions.json nba_boxscores_cache.json nba_injuries_today.json nba_rating.json mlb_results.json mlb_player_team.json mlb_injuries_today.json nhl_player_team.json nfl_player_team.json ranking.json bets.json; do
              [ -f "$f" ] && git add "$f" || true
            done
            if [ ${#included_patterns[@]} -gt 0 ]; then
              echo "[histórico central] padrões incluídos no commit: ${included_patterns[*]}"
            else
              echo "[histórico central] nenhum arquivo de odds_history nesta execução."
            fi
            if git diff --staged --quiet; then
              echo "Sem mudanças na branch data"
              break
            fi
            git commit -m "data: $(date -u '+%Y-%m-%d %H:%M') UTC"
            if git push origin data-work:data; then
              [ "$attempt" -gt 1 ] && echo "[recuperação] gravação concluída após $attempt tentativa(s)."
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Falha ao gravar dados na branch data após $max_attempts tentativas." >&2
              exit 1
            fi
            echo "[recuperação] push rejeitado (branch data avançou) — tentativa $attempt/$max_attempts, nova tentativa em ${delay}s."
            sleep "$delay"
            delay=$((delay * 2))
            attempt=$((attempt + 1))
          done
