name: Mirror Checks and Functions Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_closing_odds_deploy:
        description: Force deploy closingOddsScheduler without code changes
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      force_sync_odds_br_deploy:
        description: Force deploy syncOddsBr without code changes
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      force_firestore_rules_deploy:
        description: Force deploy firestore.rules without a new push
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

concurrency:
  group: mirror-checks-functions-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify-mirrors:
    name: Verify mirrors
    if: github.repository == 'ubereats-oss/edge-finder'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check public repository paths
        run: bash scripts/check_public_paths.sh

      - name: Check deployment log safety
        run: python3 scripts/check_deploy_log_safety.py

      - name: Test The Odds API key detector
        run: node --test scripts/test_check_no_odds_api_keys.cjs
        env:
          EDGE_REQUIRE_ODDS_API_KEYS: ${{ github.event_name != 'pull_request' }}
          THE_ODDS_API_KEYS: ${{ github.event_name != 'pull_request' && secrets.THE_ODDS_API_KEYS || '' }}
          ODDS_API_KEYS: ${{ github.event_name != 'pull_request' && secrets.ODDS_API_KEYS || '' }}

      - name: Check for committed The Odds API keys
        run: node scripts/check_no_odds_api_keys.js
        env:
          THE_ODDS_API_KEYS: ${{ github.event_name != 'pull_request' && secrets.THE_ODDS_API_KEYS || '' }}
          ODDS_API_KEYS: ${{ github.event_name != 'pull_request' && secrets.ODDS_API_KEYS || '' }}

      - name: Verify closing odds and risk mirrors
        run: node scripts/verify_mirrors.js

      - name: Verify data save helper dependencies
        run: bash scripts/check_data_save_helpers.sh

  deploy-firestore-rules:
    name: Deploy Firestore rules (manual)
    needs: verify-mirrors
    if: >
      github.repository == 'ubereats-oss/edge-finder' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.force_firestore_rules_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          skip_install: true

      - name: Validate Firestore rules publication
        run: bash scripts/deploy_firebase_quietly.sh rules
        env:
          EDGE_WIF_PROVIDER: ${{ secrets.EDGE_WIF_PROVIDER }}
          EDGE_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.EDGE_DEPLOY_SERVICE_ACCOUNT }}
          EDGE_FIREBASE_PROJECT: ${{ secrets.EDGE_FIREBASE_PROJECT }}

  detect-functions:
    name: Detect changed Functions
    if: >
      github.repository == 'ubereats-oss/edge-finder' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.detect.outputs.functions }}
      firebase_only: ${{ steps.detect.outputs.firebase_only }}
      should_deploy: ${{ steps.detect.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect affected Functions
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            forced_functions=()
            if [[ "${{ inputs.force_closing_odds_deploy }}" == "true" ]]; then
              forced_functions+=("closingOddsScheduler")
            fi
            if [[ "${{ inputs.force_sync_odds_br_deploy }}" == "true" ]]; then
              forced_functions+=("syncOddsBr")
            fi
            if [[ "${#forced_functions[@]}" -gt 0 ]]; then
              functions="$(IFS=,; echo "${forced_functions[*]}")"
              firebase_only="$(printf '%s' "$functions" | awk -F, '{ for (i=1; i<=NF; i++) { printf "%sfunctions:%s", (i==1 ? "" : ","), $i } }')"
              echo "functions=$functions" >> "$GITHUB_OUTPUT"
              echo "firebase_only=$firebase_only" >> "$GITHUB_OUTPUT"
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "functions=" >> "$GITHUB_OUTPUT"
            echo "firebase_only=" >> "$GITHUB_OUTPUT"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [[ "$before" =~ ^0+$ ]]; then
            mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$after")
          else
            mapfile -t changed < <(git diff --name-only "$before" "$after")
          fi

          functions="$(node scripts/detect_functions_to_deploy.js "${changed[@]}")"
          if [[ -z "$functions" ]]; then
            echo "functions=" >> "$GITHUB_OUTPUT"
            echo "firebase_only=" >> "$GITHUB_OUTPUT"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          firebase_only="$(printf '%s' "$functions" | awk -F, '{ for (i=1; i<=NF; i++) { printf "%sfunctions:%s", (i==1 ? "" : ","), $i } }')"
          echo "functions=$functions" >> "$GITHUB_OUTPUT"
          echo "firebase_only=$firebase_only" >> "$GITHUB_OUTPUT"
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

  deploy-functions:
    name: Deploy changed Functions
    needs:
      - verify-mirrors
      - detect-functions
    if: >
      github.repository == 'ubereats-oss/edge-finder' &&
      github.ref == 'refs/heads/main' &&
      needs.detect-functions.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          skip_install: true

      - name: Validate Functions deployment
        run: bash scripts/deploy_firebase_quietly.sh functions
        env:
          EDGE_WIF_PROVIDER: ${{ secrets.EDGE_WIF_PROVIDER }}
          EDGE_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.EDGE_DEPLOY_SERVICE_ACCOUNT }}
          EDGE_FIREBASE_PROJECT: ${{ secrets.EDGE_FIREBASE_PROJECT }}
          EDGE_FUNCTIONS_REGION: ${{ secrets.EDGE_FUNCTIONS_REGION }}
          EDGE_FUNCTIONS: ${{ needs.detect-functions.outputs.functions }}
          EDGE_FIREBASE_ONLY: ${{ needs.detect-functions.outputs.firebase_only }}
