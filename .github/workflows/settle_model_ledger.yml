name: Apurar Histórico Central de Indicações

# Roda depois que os jogos do dia terminam e antes da próxima execução do
# pipeline (update_all.yml, 18:00 UTC): busca o resultado real das indicações
# que ainda estão em aberto no histórico central (odds_history/model_ledger_*)
# e persiste a apuração na branch de dados.

on:
  schedule:
    - cron: '20 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-firebase-${{ runner.os }}

      - run: npm install firebase-admin

      - name: Restaurar histórico central da branch data
        run: |
          git fetch origin data 2>/dev/null || true
          mkdir -p odds_history
          git checkout origin/data -- 'odds_history/model_ledger_*.json' 2>/dev/null || true

      - name: Reprocessar histórico (push/void, invalidação NHL, esquema)
        run: node pipeline/reprocess_ledger_history.js

      - name: Apurar resultados das indicações em aberto
        run: node pipeline/settle_model_ledger.js

      - name: Gerar relatório de desempenho
        run: node pipeline/generate_report.js

      - name: Sincronizar relatório de desempenho com Firestore
        run: node pipeline/firebase_sync.js report
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Salvar histórico central atualizado na branch data
        # Se o push for rejeitado porque a branch data avançou (ex.: uma
        # execução de capture_closing_odds.js gravou no meio tempo),
        # recarrega o estado mais recente e reaplica só a apuração desta
        # execução por cima dele, preservando closingOdds/clv que já
        # existam — repete com espera crescente antes de desistir. Ver
        # pipeline/reapply_ledger_changes.js.
        run: |
          mkdir -p /tmp/odds_history_out /tmp/ledger_scripts
          cp odds_history/model_ledger_*.json /tmp/odds_history_out/ 2>/dev/null || true
          cp odds_history/relatorio_desempenho.md /tmp/odds_history_out/ 2>/dev/null || true
          cp odds_history/relatorio_desempenho.json /tmp/odds_history_out/ 2>/dev/null || true
          cp pipeline/reapply_ledger_changes.js pipeline/model_ledger.js /tmp/ledger_scripts/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          attempt=1
          max_attempts=6
          delay=10
          while true; do
            git fetch origin data 2>/dev/null || true
            git checkout -B data-work origin/data --force 2>/dev/null || \
              (git checkout --orphan data-work && git rm -rf . --quiet && printf 'node_modules/\n' > .gitignore && git add .gitignore)
            mkdir -p odds_history
            if [ "$attempt" -gt 1 ]; then
              node /tmp/ledger_scripts/reapply_ledger_changes.js protect-closing-odds /tmp/odds_history_out --retry
            else
              node /tmp/ledger_scripts/reapply_ledger_changes.js protect-closing-odds /tmp/odds_history_out
            fi
            odds_history_patterns=(model_ledger_*.json relatorio_desempenho.json relatorio_desempenho.md)
            included_patterns=()
            for pattern in "${odds_history_patterns[@]}"; do
              matched=false
              for f in odds_history/$pattern; do
                [ -f "$f" ] || continue
                git add "$f"
                matched=true
              done
              [ "$matched" = true ] && included_patterns+=("$pattern")
            done
            if [ ${#included_patterns[@]} -gt 0 ]; then
              echo "[histórico central] padrões incluídos no commit: ${included_patterns[*]}"
            else
              echo "[histórico central] nenhum arquivo de odds_history nesta execução."
            fi
            if git diff --staged --quiet; then
              echo "Sem mudanças no histórico central"
              break
            fi
            git commit -m "ledger: $(date -u '+%Y-%m-%d %H:%M') UTC"
            if git push origin data-work:data; then
              [ "$attempt" -gt 1 ] && echo "[recuperação] gravação concluída após $attempt tentativa(s)."
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Falha ao gravar histórico central na branch data após $max_attempts tentativas." >&2
              exit 1
            fi
            echo "[recuperação] push rejeitado (branch data avançou) — tentativa $attempt/$max_attempts, nova tentativa em ${delay}s."
            sleep "$delay"
            delay=$((delay * 2))
            attempt=$((attempt + 1))
          done
