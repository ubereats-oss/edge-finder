name: TESTE descartável - acesso casas PT
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar axios
        run: npm install axios
      - name: Testar acesso HTTP direto as 5 casas
        run: node .github/scripts/_test_pt_bookmakers.js
