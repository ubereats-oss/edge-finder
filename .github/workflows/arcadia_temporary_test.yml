name: Teste Temporário Arcadia
on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        type: string
      trigger_token:
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  deploy-test-function:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/29716291623/locations/global/workloadIdentityPools/github-actions/providers/edge-finder-main
          service_account: github-functions-deployer@odds-app-edge.iam.gserviceaccount.com
      - run: npm install --ignore-scripts
        working-directory: arcadia_temporary_test
      - run: npx -y firebase-tools@latest deploy --project odds-app-edge --config firebase.arcadia-temporary.json --only functions:arcadia-temporary:temporaryArcadiaProbe --non-interactive
  github-probe:
    needs: deploy-test-function
    runs-on: ubuntu-latest
    timeout-minutes: 33
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      ARCADIA_TEST_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
        working-directory: arcadia_temporary_test
      - name: Consultar Arcadia por 30 minutos
        shell: bash
        run: |
          export ARCADIA_TEST_API_KEY="$(node -e "const fs=require('fs');console.log(fs.readFileSync('pipeline/get_nba_props_br.js','utf8').match(/const ARCADIA_KEY = '([^']+)'/)[1])")"
          node arcadia_temporary_test/probe.js
  firebase-probe:
    needs: deploy-test-function
    runs-on: ubuntu-latest
    timeout-minutes: 33
    env:
      ARCADIA_TEST_RUN_ID: ${{ inputs.run_id }}
      ARCADIA_TEST_TRIGGER_TOKEN: ${{ inputs.trigger_token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Disparar a função uma única vez
        shell: bash
        run: |
          echo "::add-mask::$ARCADIA_TEST_TRIGGER_TOKEN"
          node - <<'NODE'
          const fs = require('node:fs');
          const https = require('node:https');
          const apiKey = fs.readFileSync('pipeline/get_nba_props_br.js', 'utf8').match(/const ARCADIA_KEY = '([^']+)'/)[1];
          const request = https.request('https://southamerica-east1-odds-app-edge.cloudfunctions.net/temporaryArcadiaProbe', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
          }, response => {
            let body = '';
            response.on('data', chunk => { body += chunk; });
            response.on('end', () => { console.log(response.statusCode, body); if (response.statusCode !== 200) process.exitCode = 1; });
          });
          request.setTimeout(1900000, () => request.destroy(new Error('Function timeout')));
          request.on('error', error => { console.error(error.message); process.exitCode = 1; });
          request.end(JSON.stringify({ runId: process.env.ARCADIA_TEST_RUN_ID, token: process.env.ARCADIA_TEST_TRIGGER_TOKEN, apiKey }));
          NODE
