name: Histórico de Odds
on:
  schedule:
    # Fora da hora cheia pra não entrar na fila do agendador do GitHub
    # junto com todo mundo que dispara em :00.
    - cron: '17 19 * * *'
  workflow_dispatch:
    inputs:
      ignore_global_reserve:
        description: 'Ignorar reserva global de cota'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  save-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependências
        run: npm install axios firebase-admin
      - name: Injetar chaves de API
        run: node scripts/export_odds_api_keys.js
        env:
          THE_ODDS_API_KEYS: ${{ secrets.THE_ODDS_API_KEYS }}
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
      - name: Restaurar histórico anterior
        # Histórico de odds (h2h/props) fica em odds_snapshots/, separado de
        # odds_history/ (histórico central de indicações). Tarball antigo
        # ainda empacotado com a pasta odds_history/ por dentro: migra o
        # conteúdo pra odds_snapshots/ antes de seguir — só acontece na
        # primeira execução depois da mudança, já que o empacotamento abaixo
        # passa a usar odds_snapshots/ dali em diante.
        run: |
          git fetch origin history 2>/dev/null && \
          git show origin/history:odds_history.tar.gz > /tmp/odds_history.tar.gz 2>/dev/null && \
          tar -xzf /tmp/odds_history.tar.gz -C . 2>/dev/null && \
          echo "Histórico restaurado" || \
          echo "Sem histórico anterior — primeira execução"
          mkdir -p odds_snapshots
          if [ -d odds_history ]; then
            echo "Tarball com estrutura antiga (odds_history/) — migrando pra odds_snapshots/"
            mv odds_history/* odds_snapshots/ 2>/dev/null || true
            rmdir odds_history 2>/dev/null || true
          fi
      - name: Restaurar histórico central para reserva dinâmica
        run: |
          mkdir -p odds_history
          git fetch origin data
          for file in $(git ls-tree -r --name-only origin/data | grep '^odds_history/model_ledger_.*\.json$'); do
            git show "origin/data:$file" > "$file"
          done
      - name: Executar coleta
        run: node pipeline/save_odds_history.js
        env:
          ODDS_API_IGNORE_GLOBAL_RESERVE: ${{ github.event.inputs.ignore_global_reserve }}
      - name: Sincronizar histórico com Firestore
        run: node pipeline/firebase_sync.js history
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Gerar referência de odds da Pinnacle (tela Conferir odds)
        # Sem reserva dinâmica de cota própria (ver save_odds_history.js) —
        # roda depois da coleta diária e da captura de fechamento já terem
        # prioridade nesta execução. Se a cota apertar, desabilitar via
        # ODDS_API_DISABLE=1 neste step ou comentar o cron deste workflow.
        run: node pipeline/get_pinnacle_reference.js
      - name: Sincronizar referência da Pinnacle com Firestore
        run: node pipeline/firebase_sync.js pinnacle_reference
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Empacotar e salvar na branch history
        run: |
          tar -czf /tmp/odds_history.tar.gz odds_snapshots/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan history-tmp
          git rm -rf . --quiet
          cp /tmp/odds_history.tar.gz .
          git add odds_history.tar.gz
          git commit -m "odds: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push origin HEAD:history --force
