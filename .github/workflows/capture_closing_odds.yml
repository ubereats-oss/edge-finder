name: Capturar Odd de Fechamento

# Roda com frequência pra pegar cada evento o mais perto possível do início
# (janela de captura: até 2h antes, até 10min depois — ver
# pipeline/capture_closing_odds.js). Indicações fora da janela numa execução
# são pegas na execução seguinte, enquanto o evento ainda não começou.
#
# Frequência não é fixa o dia inteiro — acompanha o horário real dos jogos
# de NBA/MLB/NHL/NFL (os 4 esportes que este script cobre; tênis não entra
# no model_ledger). Levantamento do histórico de commenceTime já coletado
# (42 jogos, model_ledger_*) mais o padrão conhecido de transmissão dessas
# ligas nos EUA: início concentrado entre 16h e 06h UTC (tarde/madrugada
# ET/PT), sem nenhum jogo registrado fora dessa faixa.
#   - Banda ativa (16h–06h UTC): a cada 30min, igual antes.
#   - Banda morta (06h–16h UTC): sem jogo conhecido começando aí — mantém
#     só 4 checagens esparsas por dia (rede de segurança pra jogo remarcado
#     ou horário atípico) em vez de rodar a cada 30min sem necessidade.
# Reduz de 48 pra 32 execuções/dia (~33% a menos) sem abrir brecha real de
# cobertura — todo horário de início observado ou plausível continua tendo
# pelo menos uma execução dentro da janela de captura de 2h.
#
# Step "Verificar se há evento na janela" (gate, abaixo): lê o commenceTime
# das indicações pendentes do histórico central já restaurado (sem chamar a
# API) e encerra o job ali mesmo se nenhuma estiver dentro da janela de
# captura agora. IMPORTANTE: isso NÃO reduz os minutos de Actions cobrados
# por execução — o GitHub cobra por job disparado, arredondado pra cima pro
# minuto cheio, e um job que sai no gate já consome esse minuto mínimo do
# mesmo jeito que um job que roda a captura inteira (medido: 28–42s reais em
# qualquer um dos dois casos). O ganho é evitar instalar dependência e
# chamar a API-de-odds à toa, e — o motivo de existir — gerar o log abaixo
# pra decidir com dado real se vale apertar a banda ativa.
#
# Todo run loga "[gate] evento na janela: sim/não". Depois de ~1 semana,
# contar sim/não das execuções da banda ativa (16h–06h UTC):
#   since=AAAA-MM-DD
#   gh run list --workflow=capture_closing_odds.yml --created ">=$since" \
#     --json databaseId --jq '.[].databaseId' | while read id; do
#     gh run view "$id" --log 2>/dev/null | grep '\[gate\] evento na janela'
#   done | sort | uniq -c
# Maioria "não" → vale apertar a banda/intervalo. Muitos "sim" → o custo
# atual (~960min/mês) é o preço real de cobrir os jogos, não desperdício.
on:
  schedule:
    # Minutos fora de :00/:30 de propósito — esses são os mais concorridos na
    # fila de cron do GitHub Actions e sofrem mais atraso. Mesmo intervalo de
    # 30min e mesmas bandas de horário, só deslocado pra minuto 7/37.
    - cron: '7,37 16-23 * * *'
    - cron: '7,37 0-5 * * *'
    - cron: '7 6,9,12,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restaurar histórico central da branch data
        run: |
          git fetch origin data 2>/dev/null || true
          mkdir -p odds_history
          git checkout origin/data -- 'odds_history/model_ledger_*.json' 2>/dev/null || true

      - name: Verificar se há evento na janela de captura
        id: gate
        run: |
          node -e "
          const fs = require('fs');
          const files = fs.readdirSync('odds_history').filter(f => f.startsWith('model_ledger_') && f.endsWith('.json'));
          const now = Date.now();
          const BEFORE_MS = 2 * 60 * 60 * 1000;
          const AFTER_MS  = 10 * 60 * 1000;
          let pendentes = 0, naJanela = 0;
          for (const f of files) {
            let entries;
            try { entries = JSON.parse(fs.readFileSync('odds_history/' + f, 'utf-8')); } catch { continue; }
            for (const e of entries) {
              if (e.resolutionStatus !== 'pendente') continue;
              if (e.closingOdds !== null && e.closingOdds !== undefined) continue;
              const commence = new Date(e.commenceTime).getTime();
              if (isNaN(commence)) continue;
              pendentes++;
              const delta = commence - now;
              if (delta <= BEFORE_MS && delta >= -AFTER_MS) naJanela++;
            }
          }
          const hasEvent = naJanela > 0;
          console.log('[gate] ' + naJanela + ' de ' + pendentes + ' indicação(ões) pendente(s) sem odd de fechamento estão dentro da janela agora.');
          console.log('[gate] evento na janela: ' + (hasEvent ? 'sim' : 'não'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'has_event=' + hasEvent + '\n');
          "

      - uses: actions/cache@v4
        if: steps.gate.outputs.has_event == 'true'
        with:
          path: ~/.npm
          key: npm-axios-${{ runner.os }}

      - name: Instalar axios
        if: steps.gate.outputs.has_event == 'true'
        run: npm install axios

      - name: Injetar chaves
        if: steps.gate.outputs.has_event == 'true'
        run: |
          node -e "
          const keys = process.env.ODDS_API_KEYS.split(',');
          keys.forEach(k => console.log('::add-mask::' + k.trim()));
          const lines = keys.map((k,i) => (i===0?'ODDS_API_KEY':'ODDS_API_KEY_'+(i+1))+'='+k.trim());
          require('fs').appendFileSync(process.env.GITHUB_ENV, lines.join('\n')+'\n');
          "
        env:
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}

      - name: Capturar odds de fechamento e calcular CLV
        if: steps.gate.outputs.has_event == 'true'
        run: node pipeline/capture_closing_odds.js

      - name: Salvar histórico central atualizado na branch data
        if: steps.gate.outputs.has_event == 'true'
        # Espera dentro do job (capture_closing_odds.js) pode fazer duas
        # execuções ficarem ativas ao mesmo tempo e tentarem gravar em
        # sequência próxima. Se o push for rejeitado porque a branch data
        # avançou, recarrega o estado mais recente e reaplica só a
        # closingOdds/clv desta execução por cima dele (nunca sobrescreve
        # odd de fechamento já existente) — repete com espera crescente
        # antes de desistir. Ver pipeline/reapply_ledger_changes.js.
        run: |
          mkdir -p /tmp/odds_history_out /tmp/ledger_scripts
          cp odds_history/model_ledger_*.json /tmp/odds_history_out/ 2>/dev/null || true
          cp pipeline/reapply_ledger_changes.js pipeline/model_ledger.js /tmp/ledger_scripts/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          attempt=1
          max_attempts=6
          delay=10
          while true; do
            git fetch origin data 2>/dev/null || true
            git checkout -B data-work origin/data --force 2>/dev/null || \
              (git checkout --orphan data-work && git rm -rf . --quiet && printf 'node_modules/\n' > .gitignore && git add .gitignore)
            mkdir -p odds_history
            if [ "$attempt" -gt 1 ]; then
              node /tmp/ledger_scripts/reapply_ledger_changes.js closing-odds /tmp/odds_history_out --retry
            else
              node /tmp/ledger_scripts/reapply_ledger_changes.js closing-odds /tmp/odds_history_out
            fi
            for f in odds_history/model_ledger_*.json; do
              [ -f "$f" ] && git add "$f" || true
            done
            if git diff --staged --quiet; then
              echo "Sem mudanças"
              break
            fi
            git commit -m "closing-odds: $(date -u '+%Y-%m-%d %H:%M') UTC"
            if git push origin data-work:data; then
              [ "$attempt" -gt 1 ] && echo "[recuperação] gravação concluída após $attempt tentativa(s)."
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Falha ao gravar histórico central na branch data após $max_attempts tentativas." >&2
              exit 1
            fi
            echo "[recuperação] push rejeitado (branch data avançou) — tentativa $attempt/$max_attempts, nova tentativa em ${delay}s."
            sleep "$delay"
            delay=$((delay * 2))
            attempt=$((attempt + 1))
          done
