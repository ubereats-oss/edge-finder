name: Capturar Odd de Fechamento

# Disparo just-in-time via Cloud Function: a Firebase Scheduled Function
# closingOddsScheduler (functions/index.js) roda a cada poucos minutos, lê o
# histórico central direto do GitHub (branch data) e reimplementa a mesma
# seleção de "próximo evento alcançável" (futuro priorizado sobre já
# iniciado, ver pipeline/capture_closing_odds.js) pra decidir quando disparar
# este workflow via workflow_dispatch — pouco antes do início do evento mais
# próximo. Por isso este workflow NÃO espera mais nada dentro do job: roda,
# captura tudo que estiver na janela de captura agora e encerra.
#
# O cron abaixo existe só como rede de segurança, com frequência baixa: cobre
# o caso da Cloud Function falhar, ficar fora do ar ou atrasar. O passo
# "Verificar se há evento na janela de captura" evita gastar minutos de
# Actions quando o cron dispara e não há nada pendente pra capturar.
#
# concurrency: nunca deixa duas execuções deste workflow rodarem ao mesmo
# tempo — se o cron disparar perto de um disparo da Cloud Function, a nova
# fica na fila em vez de rodar em paralelo.
concurrency:
  group: capture-closing-odds
  cancel-in-progress: false

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  capture:
    runs-on: ubuntu-latest
    # Sem espera dentro do job, a execução inteira (checkout, captura,
    # commit/push) deve terminar em poucos minutos — este timeout é só uma
    # rede de segurança.
    timeout-minutes: 15
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restaurar histórico central da branch data
        run: |
          git fetch origin data 2>/dev/null || true
          mkdir -p odds_history
          git checkout origin/data -- 'odds_history/model_ledger_*.json' 2>/dev/null || true

      - name: Verificar se há indicação pendente sem odd de fechamento
        id: gate
        # Considera apenas indicações com probabilidade de modelo válida.
        # Descartes técnicos (hasModelProb:false / validForCalibration:false)
        # não podem acionar captura nem gastar chamada da The Odds API.
        # Quem já expirou (janela de captura passada sem sucesso, marcado por
        # settle_model_ledger.js) sai daqui por closingOddsStatus.
        # Compat com indicação gravada antes do campo existir: infere pelo
        # closingOdds.
        run: |
          node -e "
          const fs = require('fs');
          const files = fs.readdirSync('odds_history').filter(f => f.startsWith('model_ledger_') && f.endsWith('.json'));
          let pendentes = 0;
          for (const f of files) {
            let entries;
            try { entries = JSON.parse(fs.readFileSync('odds_history/' + f, 'utf-8')); } catch { continue; }
            for (const e of entries) {
              if (e.hasModelProb === false || e.validForCalibration === false) continue;
              if (e.resolutionStatus !== 'pendente') continue;
              const status = e.closingOddsStatus || ((e.closingOdds !== null && e.closingOdds !== undefined) ? 'capturada' : 'pendente');
              if (status === 'pendente') pendentes++;
            }
          }
          const hasEvent = pendentes > 0;
          console.log('[gate] ' + pendentes + ' indicação(ões) com odd de fechamento pendente (nem capturada, nem expirada).');
          console.log('[gate] há indicação pendente: ' + (hasEvent ? 'sim' : 'não'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'has_event=' + hasEvent + '\n');
          "

      - uses: actions/cache@v4
        if: steps.gate.outputs.has_event == 'true'
        with:
          path: ~/.npm
          key: npm-axios-${{ runner.os }}

      - name: Instalar axios
        if: steps.gate.outputs.has_event == 'true'
        run: npm install axios

      - name: Injetar chaves
        if: steps.gate.outputs.has_event == 'true'
        run: |
          node -e "
          const keys = process.env.ODDS_API_KEYS.split(',');
          keys.forEach(k => console.log('::add-mask::' + k.trim()));
          const lines = keys.map((k,i) => (i===0?'ODDS_API_KEY':'ODDS_API_KEY_'+(i+1))+'='+k.trim());
          require('fs').appendFileSync(process.env.GITHUB_ENV, lines.join('\n')+'\n');
          "
        env:
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}

      - name: Capturar odds de fechamento e calcular CLV
        if: steps.gate.outputs.has_event == 'true'
        run: node pipeline/capture_closing_odds.js

      - name: Salvar histórico central atualizado na branch data
        if: steps.gate.outputs.has_event == 'true'
        # Duas execuções podem ficar ativas perto uma da outra (cron +
        # disparo da Cloud Function) e tentarem gravar em sequência próxima.
        # Se o push for rejeitado porque a branch data avançou, recarrega o
        # estado mais recente e reaplica só a closingOdds/clv desta execução
        # por cima dele (nunca sobrescreve odd de fechamento já existente) —
        # repete com espera crescente antes de desistir. Ver
        # pipeline/reapply_ledger_changes.js.
        run: |
          mkdir -p /tmp/odds_history_out /tmp/ledger_scripts
          cp odds_history/model_ledger_*.json /tmp/odds_history_out/ 2>/dev/null || true
          cp pipeline/reapply_ledger_changes.js pipeline/model_ledger.js pipeline/closing_odds_rules.js /tmp/ledger_scripts/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          attempt=1
          max_attempts=6
          delay=10
          while true; do
            git fetch origin data 2>/dev/null || true
            git checkout -B data-work origin/data --force 2>/dev/null || \
              (git checkout --orphan data-work && git rm -rf . --quiet && printf 'node_modules/\n' > .gitignore && git add .gitignore)
            mkdir -p odds_history
            if [ "$attempt" -gt 1 ]; then
              node /tmp/ledger_scripts/reapply_ledger_changes.js closing-odds /tmp/odds_history_out --retry
            else
              node /tmp/ledger_scripts/reapply_ledger_changes.js closing-odds /tmp/odds_history_out
            fi
            odds_history_patterns=(model_ledger_*.json)
            included_patterns=()
            for pattern in "${odds_history_patterns[@]}"; do
              matched=false
              for f in odds_history/$pattern; do
                [ -f "$f" ] || continue
                git add "$f"
                matched=true
              done
              [ "$matched" = true ] && included_patterns+=("$pattern")
            done
            if [ ${#included_patterns[@]} -gt 0 ]; then
              echo "[histórico central] padrões incluídos no commit: ${included_patterns[*]}"
            else
              echo "[histórico central] nenhum arquivo de odds_history nesta execução."
            fi
            if git diff --staged --quiet; then
              echo "Sem mudanças"
              break
            fi
            git commit -m "closing-odds: $(date -u '+%Y-%m-%d %H:%M') UTC"
            if git push origin data-work:data; then
              [ "$attempt" -gt 1 ] && echo "[recuperação] gravação concluída após $attempt tentativa(s)."
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Falha ao gravar histórico central na branch data após $max_attempts tentativas." >&2
              exit 1
            fi
            echo "[recuperação] push rejeitado (branch data avançou) — tentativa $attempt/$max_attempts, nova tentativa em ${delay}s."
            sleep "$delay"
            delay=$((delay * 2))
            attempt=$((attempt + 1))
          done
