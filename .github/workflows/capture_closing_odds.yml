name: Capturar Odd de Fechamento

# Independente de agendador: pipeline/capture_closing_odds.js espera (sleep)
# dentro do próprio job até perto do início do evento pendente mais próximo
# (até MAX_JOB_WAIT_MS = 5h) e, ao terminar, dispara programaticamente uma
# nova execução deste workflow via API do GitHub pra continuar a cadeia a
# partir do evento seguinte — workflow_dispatch é confiável, diferente do
# cron, que atrasa/descarta execuções sob carga (ver script pra detalhes).
#
# O cron abaixo existe só como rede de segurança, com frequência baixa: pega
# o primeiro evento do dia (nada disparado ainda) ou reinicia a cadeia se
# ela foi interrompida (job cancelado, disparo da próxima execução falhou,
# etc.). Minuto fora de :00/:30 de propósito (mais concorrido na fila do
# GitHub Actions).
#
# concurrency: nunca deixa duas execuções deste workflow rodarem ao mesmo
# tempo — se o cron disparar enquanto uma execução está esperando/rodando,
# a nova fica na fila em vez de rodar em paralelo (cancel-in-progress:
# false, de propósito — cancelar cancelaria uma espera em andamento e
# quebraria a cadeia). Isso é o que impede a cadeia de se multiplicar.
concurrency:
  group: capture-closing-odds
  cancel-in-progress: false

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # O disparo da próxima execução (workflow_dispatch via API, ver
  # triggerNextRun() no script) usa GH_PAT, não o GITHUB_TOKEN automático —
  # este bloco de permissions não afeta esse disparo. O escopo de GH_PAT
  # precisa incluir Actions: write (PAT fine-grained) ou "workflow" (PAT
  # clássico) pra isso funcionar.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  capture:
    runs-on: ubuntu-latest
    # Teto de execução do GitHub Actions em runner hospedado é 6h (360min),
    # não configurável pra cima. MAX_JOB_WAIT_MS no script já é 5h com
    # margem — este timeout é só uma rede de segurança adicional pra nunca
    # chegar no cutoff duro da plataforma de um jeito abrupto.
    timeout-minutes: 330
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restaurar histórico central da branch data
        run: |
          git fetch origin data 2>/dev/null || true
          mkdir -p odds_history
          git checkout origin/data -- 'odds_history/model_ledger_*.json' 2>/dev/null || true

      - name: Verificar se há evento no alcance da espera
        id: gate
        # Mesmo alcance que pipeline/capture_closing_odds.js usa pra decidir
        # se espera (MAX_JOB_WAIT_MS + TARGET_LEAD_MS) — não só a janela de
        # captura de 2h, já que agora a execução pode esperar até 5h por um
        # evento que ainda não chegou perto do início.
        run: |
          node -e "
          const fs = require('fs');
          const files = fs.readdirSync('odds_history').filter(f => f.startsWith('model_ledger_') && f.endsWith('.json'));
          const now = Date.now();
          const AFTER_MS = 10 * 60 * 1000;
          const MAX_WAIT_MS = 5 * 60 * 60 * 1000 + 3 * 60 * 1000;
          let pendentes = 0, alcancaveis = 0;
          for (const f of files) {
            let entries;
            try { entries = JSON.parse(fs.readFileSync('odds_history/' + f, 'utf-8')); } catch { continue; }
            for (const e of entries) {
              if (e.resolutionStatus !== 'pendente') continue;
              if (e.closingOdds !== null && e.closingOdds !== undefined) continue;
              const commence = new Date(e.commenceTime).getTime();
              if (isNaN(commence)) continue;
              pendentes++;
              const delta = commence - now;
              if (delta >= -AFTER_MS && delta <= MAX_WAIT_MS) alcancaveis++;
            }
          }
          const hasEvent = alcancaveis > 0;
          console.log('[gate] ' + alcancaveis + ' de ' + pendentes + ' indicação(ões) pendente(s) sem odd de fechamento estão no alcance da espera agora.');
          console.log('[gate] evento no alcance: ' + (hasEvent ? 'sim' : 'não'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'has_event=' + hasEvent + '\n');
          "

      - uses: actions/cache@v4
        if: steps.gate.outputs.has_event == 'true'
        with:
          path: ~/.npm
          key: npm-axios-${{ runner.os }}

      - name: Instalar axios
        if: steps.gate.outputs.has_event == 'true'
        run: npm install axios

      - name: Injetar chaves
        if: steps.gate.outputs.has_event == 'true'
        run: |
          node -e "
          const keys = process.env.ODDS_API_KEYS.split(',');
          keys.forEach(k => console.log('::add-mask::' + k.trim()));
          const lines = keys.map((k,i) => (i===0?'ODDS_API_KEY':'ODDS_API_KEY_'+(i+1))+'='+k.trim());
          require('fs').appendFileSync(process.env.GITHUB_ENV, lines.join('\n')+'\n');
          "
        env:
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}

      - name: Capturar odds de fechamento e calcular CLV
        if: steps.gate.outputs.has_event == 'true'
        run: node pipeline/capture_closing_odds.js
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Salvar histórico central atualizado na branch data
        if: steps.gate.outputs.has_event == 'true'
        # Espera dentro do job (capture_closing_odds.js) pode fazer duas
        # execuções ficarem ativas ao mesmo tempo e tentarem gravar em
        # sequência próxima. Se o push for rejeitado porque a branch data
        # avançou, recarrega o estado mais recente e reaplica só a
        # closingOdds/clv desta execução por cima dele (nunca sobrescreve
        # odd de fechamento já existente) — repete com espera crescente
        # antes de desistir. Ver pipeline/reapply_ledger_changes.js.
        run: |
          mkdir -p /tmp/odds_history_out /tmp/ledger_scripts
          cp odds_history/model_ledger_*.json /tmp/odds_history_out/ 2>/dev/null || true
          cp pipeline/reapply_ledger_changes.js pipeline/model_ledger.js /tmp/ledger_scripts/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          attempt=1
          max_attempts=6
          delay=10
          while true; do
            git fetch origin data 2>/dev/null || true
            git checkout -B data-work origin/data --force 2>/dev/null || \
              (git checkout --orphan data-work && git rm -rf . --quiet && printf 'node_modules/\n' > .gitignore && git add .gitignore)
            mkdir -p odds_history
            if [ "$attempt" -gt 1 ]; then
              node /tmp/ledger_scripts/reapply_ledger_changes.js closing-odds /tmp/odds_history_out --retry
            else
              node /tmp/ledger_scripts/reapply_ledger_changes.js closing-odds /tmp/odds_history_out
            fi
            odds_history_patterns=(model_ledger_*.json)
            included_patterns=()
            for pattern in "${odds_history_patterns[@]}"; do
              matched=false
              for f in odds_history/$pattern; do
                [ -f "$f" ] || continue
                git add "$f"
                matched=true
              done
              [ "$matched" = true ] && included_patterns+=("$pattern")
            done
            if [ ${#included_patterns[@]} -gt 0 ]; then
              echo "[histórico central] padrões incluídos no commit: ${included_patterns[*]}"
            else
              echo "[histórico central] nenhum arquivo de odds_history nesta execução."
            fi
            if git diff --staged --quiet; then
              echo "Sem mudanças"
              break
            fi
            git commit -m "closing-odds: $(date -u '+%Y-%m-%d %H:%M') UTC"
            if git push origin data-work:data; then
              [ "$attempt" -gt 1 ] && echo "[recuperação] gravação concluída após $attempt tentativa(s)."
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Falha ao gravar histórico central na branch data após $max_attempts tentativas." >&2
              exit 1
            fi
            echo "[recuperação] push rejeitado (branch data avançou) — tentativa $attempt/$max_attempts, nova tentativa em ${delay}s."
            sleep "$delay"
            delay=$((delay * 2))
            attempt=$((attempt + 1))
          done
