
name: Atualizar Modelo

on:
  workflow_dispatch:
    inputs:
      sport:
        description: 'Esporte a atualizar'
        required: true
        default: 'all'
        type: choice
        options:
          - nba_br
          - nba
          - mlb
          - tennis
          - nhl
          - nfl
          - all

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependências
        run: npm install axios firebase-admin

      - name: Injetar chaves da Odds API no ambiente
        run: |
          node -e "
          const keys = process.env.ODDS_API_KEYS.split(',');
          keys.forEach(k => console.log('::add-mask::' + k.trim()));
          const lines = [];
          keys.forEach((k, i) => {
            const name = i === 0 ? 'ODDS_API_KEY' : 'ODDS_API_KEY_' + (i + 1);
            lines.push(name + '=' + k.trim());
          });
          require('fs').appendFileSync(process.env.GITHUB_ENV, lines.join('\n') + '\n');
          console.log('Chaves injetadas no ambiente:', keys.length);
          "
        env:
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}

      - name: Restaurar histórico anterior
        run: |
          git fetch origin history 2>/dev/null && \
          git show origin/history:odds_history.tar.gz > /tmp/odds_history.tar.gz 2>/dev/null && \
          tar -xzf /tmp/odds_history.tar.gz -C . 2>/dev/null && \
          echo "Histórico restaurado" || \
          echo "Sem histórico anterior"
          mkdir -p odds_history

      - name: Restaurar dados da branch data
        run: |
          git fetch origin data 2>/dev/null || echo "Branch data não existe ainda"
          git show origin/data:nba_player_stats.json.gz > /tmp/nba_player_stats.json.gz 2>/dev/null && \
            gunzip -c /tmp/nba_player_stats.json.gz > nba_player_stats.json && \
            echo "nba_player_stats.json restaurado: $(wc -c < nba_player_stats.json) bytes" || \
            echo "nba_player_stats.json não encontrado — modelo usará stats vazios"
          git show origin/data:mlb_player_stats.json.gz > /tmp/mlb_player_stats.json.gz 2>/dev/null && \
            gunzip -c /tmp/mlb_player_stats.json.gz > mlb_player_stats.json && \
            echo "mlb_player_stats.json restaurado: $(wc -c < mlb_player_stats.json) bytes" || \
            echo "mlb_player_stats.json não encontrado — modelo usará stats vazios"
          for f in nba_player_team.json nba_boxscores_cache.json nba_injuries_today.json nba_rating.json mlb_player_team.json mlb_injuries_today.json; do
            git show origin/data:$f > $f 2>/dev/null && echo "Restaurado: $f" || echo "Não encontrado: $f"
          done
          git show origin/data:bets.json > bets.json 2>/dev/null && echo "bets.json restaurado" || echo '[]' > bets.json

      - name: Atualizar injuries (NBA)
        if: ${{ github.event.inputs.sport == 'nba_br' || github.event.inputs.sport == 'nba' || github.event.inputs.sport == 'all' }}
        run: node pipeline/get_nba_injuries.js

      - name: Atualizar props BR (NBA)
        if: ${{ github.event.inputs.sport == 'nba_br' || github.event.inputs.sport == 'all' }}
        run: node pipeline/get_nba_props_br.js

      - name: Rodar modelo props BR (NBA)
        if: ${{ github.event.inputs.sport == 'nba_br' || github.event.inputs.sport == 'all' }}
        run: node pipeline/model_nba_props_br.js

      - name: Atualizar odds NBA H2H
        if: ${{ github.event.inputs.sport == 'nba_br' || github.event.inputs.sport == 'nba' || github.event.inputs.sport == 'all' }}
        run: node pipeline/get_nba_odds.js

      - name: Rodar modelo NBA H2H
        if: ${{ github.event.inputs.sport == 'nba_br' || github.event.inputs.sport == 'nba' || github.event.inputs.sport == 'all' }}
        run: node pipeline/model_nba.js

      - name: Atualizar props NBA (padrão)
        if: ${{ github.event.inputs.sport == 'nba' }}
        run: node pipeline/get_nba_props.js

      - name: Rodar modelo props NBA (padrão)
        if: ${{ github.event.inputs.sport == 'nba' }}
        run: node pipeline/model_nba_props.js

      - name: Atualizar injuries (MLB)
        if: ${{ github.event.inputs.sport == 'mlb' || github.event.inputs.sport == 'all' }}
        run: node pipeline/get_mlb_injuries.js

      - name: Atualizar times MLB
        if: ${{ github.event.inputs.sport == 'mlb' || github.event.inputs.sport == 'all' }}
        run: node pipeline/get_mlb_player_teams.js

      - name: Atualizar props MLB
        if: ${{ github.event.inputs.sport == 'mlb' || github.event.inputs.sport == 'all' }}
        run: node pipeline/get_mlb_props.js

      - name: Rodar modelo props MLB
        if: ${{ github.event.inputs.sport == 'mlb' || github.event.inputs.sport == 'all' }}
        run: node pipeline/model_mlb_props.js

      - name: Atualizar odds Tênis
        if: ${{ github.event.inputs.sport == 'tennis' }}
        run: node pipeline/get_odds.js

      - name: Rodar modelo Tênis
        if: ${{ github.event.inputs.sport == 'tennis' }}
        run: node pipeline/model_prob.js

      - name: Restaurar stats NHL/NFL
        if: ${{ github.event.inputs.sport == 'nhl' || github.event.inputs.sport == 'nfl' || github.event.inputs.sport == 'all' }}
        run: |
          git show origin/data:nhl_player_stats.json.gz > /tmp/nhl_player_stats.json.gz 2>/dev/null && gunzip -c /tmp/nhl_player_stats.json.gz > nhl_player_stats.json || true
          git show origin/data:nfl_player_stats.json.gz > /tmp/nfl_player_stats.json.gz 2>/dev/null && gunzip -c /tmp/nfl_player_stats.json.gz > nfl_player_stats.json || true
          for f in nhl_player_team.json nfl_player_team.json; do git show origin/data:$f > $f 2>/dev/null || true; done

      - name: Atualizar times NHL
        if: ${{ github.event.inputs.sport == 'nhl' || github.event.inputs.sport == 'all' }}
        run: node pipeline/get_nhl_player_teams.js

      - name: Buscar props NHL
        if: ${{ github.event.inputs.sport == 'nhl' || github.event.inputs.sport == 'all' }}
        run: node pipeline/get_nhl_props.js

      - name: Rodar modelo NHL
        if: ${{ github.event.inputs.sport == 'nhl' || github.event.inputs.sport == 'all' }}
        run: |
          if [ ! -f "nhl_player_stats.json" ]; then
            echo "nhl_player_stats.json ausente. Pulando modelo NHL."
            exit 0
          fi
          node pipeline/model_nhl_props.js

      - name: Atualizar times NFL
        if: ${{ github.event.inputs.sport == 'nfl' || github.event.inputs.sport == 'all' }}
        run: node pipeline/get_nfl_player_teams.js

      - name: Buscar props NFL
        if: ${{ github.event.inputs.sport == 'nfl' || github.event.inputs.sport == 'all' }}
        run: node pipeline/get_nfl_props.js

      - name: Rodar modelo NFL
        if: ${{ github.event.inputs.sport == 'nfl' || github.event.inputs.sport == 'all' }}
        run: node pipeline/model_nfl_props.js

      - name: Sincronizar resultados com Firestore
        run: node pipeline/firebase_sync.js results
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Sincronizar apostas com Firestore
        run: node pipeline/firebase_sync.js bets
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Salvar dados na branch data
        # Inclui o histórico central de indicações (odds_history/
        # model_ledger_*.json) — sem isso, as indicações avaliadas pelos
        # modelos rodados neste workflow eram perdidas ao fim do job.
        # Mesmo mecanismo de recuperação dos outros workflows: se o push for
        # rejeitado porque a branch data avançou (ex.: capture_closing_odds.js
        # gravou no meio tempo), recarrega o estado mais recente e reaplica
        # só esta execução por cima dele, preservando closingOdds/clv que já
        # existam — repete com espera crescente antes de desistir. Ver
        # pipeline/reapply_ledger_changes.js.
        run: |
          cp .github/scripts/save_stats_gz.sh /tmp/save_stats_gz.sh
          mkdir -p /tmp/to-save /tmp/to-save-gz /tmp/to-save/odds_history /tmp/ledger_scripts
          gzip -n -c nba_player_stats.json > /tmp/to-save-gz/nba_player_stats.json.gz 2>/dev/null || true
          gzip -n -c mlb_player_stats.json > /tmp/to-save-gz/mlb_player_stats.json.gz 2>/dev/null || true
          gzip -n -c nhl_player_stats.json > /tmp/to-save-gz/nhl_player_stats.json.gz 2>/dev/null || true
          gzip -n -c nfl_player_stats.json > /tmp/to-save-gz/nfl_player_stats.json.gz 2>/dev/null || true
          for f in nba_player_team.json nba_injuries_today.json nba_rating.json mlb_player_team.json mlb_injuries_today.json bets.json; do
            [ -f "$f" ] && cp "$f" /tmp/to-save/ || true
          done
          cp odds_history/model_ledger_*.json /tmp/to-save/odds_history/ 2>/dev/null || true
          cp pipeline/reapply_ledger_changes.js pipeline/model_ledger.js /tmp/ledger_scripts/

          node -e "
          const fs = require('fs');
          const dir = '/tmp/to-save/odds_history';
          let total = 0, arquivos = 0;
          if (fs.existsSync(dir)) {
            for (const f of fs.readdirSync(dir)) {
              if (!f.startsWith('model_ledger_') || !f.endsWith('.json')) continue;
              arquivos++;
              try { total += JSON.parse(fs.readFileSync(dir + '/' + f, 'utf-8')).length; } catch {}
            }
          }
          console.log('[ledger] histórico central desta execução: ' + total + ' indicação(ões) em ' + arquivos + ' partição(ões).');
          "

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          attempt=1
          max_attempts=6
          delay=10
          while true; do
            git fetch origin data 2>/dev/null || true
            git checkout -B data-work origin/data --force 2>/dev/null || \
              (git checkout --orphan data-work && git rm -rf . --quiet && printf 'node_modules/\n' > .gitignore && git add .gitignore)
            mkdir -p odds_history

            for f in /tmp/to-save-gz/*.gz; do
              [ -f "$f" ] || continue
              bash /tmp/save_stats_gz.sh "$(basename "$f" _player_stats.json.gz)" "$f" "$(basename "$f")"
            done
            cp /tmp/to-save/* . 2>/dev/null || true
            if [ "$attempt" -gt 1 ]; then
              node /tmp/ledger_scripts/reapply_ledger_changes.js protect-closing-odds /tmp/to-save/odds_history --retry
            else
              node /tmp/ledger_scripts/reapply_ledger_changes.js protect-closing-odds /tmp/to-save/odds_history
            fi

            for f in *.gz nba_player_team.json nba_injuries_today.json nba_rating.json mlb_player_team.json mlb_injuries_today.json bets.json odds_history/*.json; do
              [ -f "$f" ] && git add "$f" || true
            done
            if git diff --staged --quiet; then
              echo "Sem mudanças na branch data"
              break
            fi
            git commit -m "data: $(date -u '+%Y-%m-%d %H:%M') UTC"
            if git push origin data-work:data; then
              [ "$attempt" -gt 1 ] && echo "[recuperação] gravação concluída após $attempt tentativa(s)."
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Falha ao gravar dados na branch data após $max_attempts tentativas." >&2
              exit 1
            fi
            echo "[recuperação] push rejeitado (branch data avançou) — tentativa $attempt/$max_attempts, nova tentativa em ${delay}s."
            sleep "$delay"
            delay=$((delay * 2))
            attempt=$((attempt + 1))
          done

