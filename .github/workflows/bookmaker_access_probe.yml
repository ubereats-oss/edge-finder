name: Diagnóstico de acesso às casas
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
jobs:
  probe:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53
      options: --init --ipc=host --user 1001
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verificar versão do Playwright e navegador da imagem
        run: node scripts/verify_playwright_image.cjs
      - name: Testar páginas públicas sem sessão
        run: node pipeline/probe_bookmaker_access.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bookmaker-access-probe-${{ github.run_id }}
          path: bookmaker_access_probe.json
          if-no-files-found: ignore
          retention-days: 1
