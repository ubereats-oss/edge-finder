name: Atualizar Ranking Tênis
on:
  schedule:
    - cron: '0 17 * * 1'
  workflow_dispatch:
permissions:
  contents: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  ranking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-axios-${{ runner.os }}
      - run: npm install axios
      - run: node pipeline/get_tennis_ranking.js
      - name: Salvar ranking na branch data
        run: |
          cp ranking.json /tmp/ranking.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin data 2>/dev/null || true
          git checkout -b data-work origin/data --force 2>/dev/null || \
            (git checkout --orphan data-work && git rm -rf . --quiet && printf 'node_modules/\n' > .gitignore && git add .gitignore)
          cp /tmp/ranking.json ranking.json
          git add ranking.json
          git diff --staged --quiet && echo "Sem mudanças" || git commit -m "ranking: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push origin data-work:data
