name: Atualizar NHL Props

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-nhl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependências
        run: npm install axios firebase-admin

      - name: Injetar chaves da Odds API
        run: |
          node -e "
          const keys = process.env.ODDS_API_KEYS.split(',');
          const lines = [];
          keys.forEach((k, i) => {
            const name = i === 0 ? 'ODDS_API_KEY' : 'ODDS_API_KEY_' + (i + 1);
            lines.push(name + '=' + k.trim());
          });
          require('fs').appendFileSync(process.env.GITHUB_ENV, lines.join('\n') + '\n');
          console.log('Chaves injetadas:', keys.length);
          "
        env:
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}

      - name: Restaurar stats NHL da branch data
        run: |
          git fetch origin data 2>/dev/null || echo "Branch data não existe ainda"
          git show origin/data:nhl_player_stats.json.gz > /tmp/nhl_player_stats.json.gz 2>/dev/null && \
            gunzip -c /tmp/nhl_player_stats.json.gz > nhl_player_stats.json && \
            echo "nhl_player_stats.json restaurado: $(wc -c < nhl_player_stats.json) bytes" || \
            echo "nhl_player_stats.json não encontrado — será criado do zero"
          for f in nhl_player_team.json; do
            git show origin/data:$f > $f 2>/dev/null && echo "Restaurado: $f" || echo "Não encontrado: $f"
          done

      - name: Atualizar times NHL
        run: node pipeline/get_nhl_player_teams.js

      - name: Atualizar stats NHL (incremental)
        run: node pipeline/get_nhl_player_stats.js

      - name: Buscar props NHL
        run: node pipeline/get_nhl_props.js

      - name: Rodar modelo NHL
        run: node pipeline/model_nhl_props.js

      - name: Sincronizar com Firestore
        run: node pipeline/firebase_sync.js nhl
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Salvar dados na branch data
        run: |
          gzip -c nhl_player_stats.json > /tmp/nhl_player_stats.json.gz 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin data 2>/dev/null || true
          git checkout --orphan nhl-data-tmp
          git rm -rf . --quiet
          printf 'node_modules/\n*.json\n' > .gitignore
          cp /tmp/nhl_player_stats.json.gz . 2>/dev/null || true
          git show origin/data:nba_player_stats.json.gz > nba_player_stats.json.gz 2>/dev/null || true
          git show origin/data:mlb_player_stats.json.gz > mlb_player_stats.json.gz 2>/dev/null || true
          for f in nba_player_team.json nba_injuries_today.json nba_rating.json mlb_player_team.json mlb_injuries_today.json mlb_team_rating.json bets.json; do
            git show origin/data:$f > $f 2>/dev/null || true
          done
          printf 'node_modules/\n' > .gitignore
          git add .gitignore || true
          for f in *.gz nhl_player_team.json nba_player_team.json nba_injuries_today.json nba_rating.json mlb_player_team.json mlb_injuries_today.json mlb_team_rating.json bets.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          git diff --staged --quiet && echo "Sem mudanças" || git commit -m "nhl: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push origin HEAD:data --force
