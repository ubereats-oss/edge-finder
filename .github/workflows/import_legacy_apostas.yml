name: Importar Histórico Legado de Apostas

# Importação única do histórico manual (apostas_com_resultados.json) pro
# histórico central de indicações — precisa rodar em produção porque a
# apuração (settle_model_ledger.yml) só encontra partições na branch de
# dados, e a importação nunca tinha sido persistida lá antes.
#
# Só roda quando disparado manualmente, e mesmo assim só importa de verdade
# na primeira vez: pipeline/import_legacy_apostas.js grava um marcador em
# odds_history/.legacy_apostas_imported.json e pula a importação se ele já
# existir — então disparar este workflow de novo por engano não duplica nada.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restaurar histórico legado e ledger da branch data
        run: |
          git fetch origin data 2>/dev/null || true
          git show origin/data:apostas_com_resultados.json > apostas_com_resultados.json 2>/dev/null || true
          mkdir -p odds_history
          git checkout origin/data -- 'odds_history/model_ledger_*.json' 'odds_history/.legacy_apostas_imported.json' 2>/dev/null || true

      - name: Importar histórico legado (pula se já importado)
        run: node pipeline/import_legacy_apostas.js

      - name: Salvar histórico central na branch data
        # Se o push for rejeitado porque a branch data avançou (ex.: uma
        # execução de capture_closing_odds.js gravou no meio tempo),
        # recarrega o estado mais recente e reaplica só o que esta execução
        # importou por cima dele, preservando closingOdds/clv que já
        # existam — repete com espera crescente antes de desistir. Ver
        # pipeline/reapply_ledger_changes.js.
        run: |
          mkdir -p /tmp/odds_history_out /tmp/ledger_scripts
          cp odds_history/model_ledger_*.json /tmp/odds_history_out/ 2>/dev/null || true
          cp odds_history/.legacy_apostas_imported.json /tmp/odds_history_out/ 2>/dev/null || true
          cp pipeline/reapply_ledger_changes.js pipeline/model_ledger.js /tmp/ledger_scripts/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          attempt=1
          max_attempts=6
          delay=10
          while true; do
            git fetch origin data 2>/dev/null || true
            git checkout -B data-work origin/data --force 2>/dev/null || \
              (git checkout --orphan data-work && git rm -rf . --quiet && printf 'node_modules/\n' > .gitignore && git add .gitignore)
            mkdir -p odds_history
            if [ "$attempt" -gt 1 ]; then
              node /tmp/ledger_scripts/reapply_ledger_changes.js protect-closing-odds /tmp/odds_history_out --retry
            else
              node /tmp/ledger_scripts/reapply_ledger_changes.js protect-closing-odds /tmp/odds_history_out
            fi
            for f in odds_history/*.json; do
              [ -f "$f" ] && git add "$f" || true
            done
            [ -f odds_history/.legacy_apostas_imported.json ] && git add odds_history/.legacy_apostas_imported.json || true
            if git diff --staged --quiet; then
              echo "Sem mudanças"
              break
            fi
            git commit -m "ledger: importação histórico legado $(date -u '+%Y-%m-%d %H:%M') UTC"
            if git push origin data-work:data; then
              [ "$attempt" -gt 1 ] && echo "[recuperação] gravação concluída após $attempt tentativa(s)."
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Falha ao gravar histórico central na branch data após $max_attempts tentativas." >&2
              exit 1
            fi
            echo "[recuperação] push rejeitado (branch data avançou) — tentativa $attempt/$max_attempts, nova tentativa em ${delay}s."
            sleep "$delay"
            delay=$((delay * 2))
            attempt=$((attempt + 1))
          done
