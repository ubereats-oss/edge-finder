name: Atualizar Estatísticas de Jogadores

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-axios-${{ runner.os }}

      - name: Instalar dependências
        run: npm install axios

      - name: Restaurar stats da branch data
        run: |
          git fetch origin data 2>/dev/null || echo "Branch data não existe ainda"
          git show origin/data:nba_player_stats.json.gz > /tmp/nba_player_stats.json.gz 2>/dev/null && \
            gunzip -c /tmp/nba_player_stats.json.gz > nba_player_stats.json && \
            echo "nba_player_stats.json restaurado: $(wc -c < nba_player_stats.json) bytes" || \
            echo "nba_player_stats.json não encontrado — será criado do zero"
          git show origin/data:mlb_player_stats.json.gz > /tmp/mlb_player_stats.json.gz 2>/dev/null && \
            gunzip -c /tmp/mlb_player_stats.json.gz > mlb_player_stats.json && \
            echo "mlb_player_stats.json restaurado: $(wc -c < mlb_player_stats.json) bytes" || \
            echo "mlb_player_stats.json não encontrado — será criado do zero"

      - name: Atualizar stats NBA (incremental)
        run: node pipeline/get_nba_player_stats.js

      - name: Atualizar stats MLB (incremental)
        run: node pipeline/get_mlb_player_stats.js

      - name: Salvar stats na branch data
        run: |
          cp .github/scripts/save_stats_gz.sh /tmp/save_stats_gz.sh
          gzip -n -c nba_player_stats.json > /tmp/nba_player_stats.json.gz
          gzip -n -c mlb_player_stats.json > /tmp/mlb_player_stats.json.gz 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin data 2>/dev/null || true
          git checkout -b data-work origin/data --force 2>/dev/null || \
            (git checkout --orphan data-work && git rm -rf . --quiet && printf 'node_modules/\n' > .gitignore && git add .gitignore)
          for f in /tmp/nba_player_stats.json.gz /tmp/mlb_player_stats.json.gz; do
            [ -f "$f" ] || continue
            bash /tmp/save_stats_gz.sh "$(basename "$f" _player_stats.json.gz)" "$f" "$(basename "$f")"
          done
          for f in nba_player_stats.json.gz mlb_player_stats.json.gz; do
            [ -f "$f" ] && git add "$f" || true
          done
          [ -f mlb_team_rating.json ] && git add mlb_team_rating.json || true
          git diff --staged --quiet && echo "Sem mudanças nos stats" || git commit -m "stats: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push origin data-work:data
